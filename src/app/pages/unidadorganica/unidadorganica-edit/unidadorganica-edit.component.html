<h2 mat-dialog-title class="m-b-24">{{ titulo }}</h2>

<mat-divider></mat-divider>
<mat-dialog-content class="mat-typography" style="max-width: 600px">
  <form [formGroup]="uoForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Unidad Orgánica</mat-label>
      <input
        type="text"
        placeholder="Escriba para buscar..."
        matInput
        formControlName="idDependencia"
        [matAutocomplete]="auto"
      />
      <mat-autocomplete
        #auto="matAutocomplete"
        [displayWith]="mostrarDescripcion"
      >
        <mat-option *ngFor="let u of unidadesFiltradas$ | async" [value]="u">
          {{ u.descripcion }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="descripcion" />
      <mat-error *ngIf="uoForm.get('descripcion')?.hasError('required')"
        >Campo requerido</mat-error
      >
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Abrev</mat-label>
      <input matInput formControlName="abrev" />
      <mat-error *ngIf="uoForm.get('abrev')?.hasError('required')"
        >Campo requerido</mat-error
      >
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-divider></mat-divider>
<mat-dialog-actions class="p-24">
  <button
    mat-flat-button
    [mat-dialog-close]="true"
    [disabled]="uoForm.invalid"
    color="primary"
    (click)="onSubmit()"
  >
    Guardar
  </button>
  <button mat-stroked-button color="warn" mat-dialog-close>Cancelar</button>
</mat-dialog-actions>
