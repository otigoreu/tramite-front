<app-notification
  *ngIf="notificacion()"
  [title]="notificacion()?.title ?? ''"
  [description]="notificacion()?.description ?? ''"
  [type]="notificacion()?.type ?? 'info'"
/>

<h2 mat-dialog-title class="m-b-24">{{ titulo }}</h2>

<mat-divider></mat-divider>

<mat-dialog-content class="mat-typography w-100">
  <form [formGroup]="uo_usuarioForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Unidad Orgánica</mat-label>
      <input
        type="text"
        placeholder="Escriba para buscar..."
        matInput
        formControlName="idUnidadOrganica"
        [matAutocomplete]="auto"
      />
      <mat-autocomplete
        #auto="matAutocomplete"
        [displayWith]="mostrarDescripcion"
      >
        <mat-option *ngFor="let u of unidadesFiltradas$ | async" [value]="u">
          {{ u.descripcion }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Desde</mat-label>
      <input
        matInput
        [matDatepicker]="pickerDesde"
        placeholder="Desde"
        [formControl]="uo_usuarioForm.controls.desde"
        appEnterKeyFocus
        required
      />
      <mat-datepicker-toggle
        matIconSuffix
        [for]="pickerDesde"
      ></mat-datepicker-toggle>
      <mat-datepicker #pickerDesde></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Hasta</mat-label>
      <input
        matInput
        [matDatepicker]="pickerHasta"
        placeholder="Hasta"
        [formControl]="uo_usuarioForm.controls.hasta"
        appEnterKeyFocus
      />
      <mat-hint
        >*Si no selecciona una fecha, el acceso seguirá vigente
        indefinidamente.</mat-hint
      >
      <mat-datepicker-toggle
        matIconSuffix
        [for]="pickerHasta"
      ></mat-datepicker-toggle>
      <mat-datepicker #pickerHasta></mat-datepicker>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-divider></mat-divider>
<mat-dialog-actions class="p-24">
  <button
    mat-flat-button
    [disabled]="uo_usuarioForm.invalid"
    color="primary"
    (click)="onSubmit()"
  >
    Guardar
  </button>
  <button mat-stroked-button color="warn" mat-dialog-close>Cancelar</button>
</mat-dialog-actions>
